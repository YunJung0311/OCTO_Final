<script src="minseo-face.js"></script>
<script>
"use strict";
// =====================================================================
// 화면 · 캐릭터 · 서체
// =====================================================================
const SCREEN = { w: 320, h: 240 };
const CHAR = { bg: "#F9503C", ink: "#121212", halo: "#FFFFFF" };
// 말풍선 채움색. 민트는 토마토 배경의 보색 쪽. 글자 그림자는 채움색을 한 톤 눌러서.
const FILLS = {
  mint:   { label: "민트",  fill: "#BFF2E1", shadow: "#6FCDB0" },
  yellow: { label: "노랑",  fill: "#FFEC8F", shadow: "#F2B54E" },
  white:  { label: "흰색",  fill: "#FFFFFF", shadow: "#F2A3C4" },
};
const FONT_DIR = location.pathname.includes("/docs/subtitle/") ? "../../fonts/" : "fonts/";
// native = 실측한 픽셀 그리드 (fontTools로 외곽선 좌표 간격을 재서 확인)
const FONTS = {
  DOSPilgi:  { label: "도스필기",   native: 16, file: "DOSPilgi.woff2" },
  DOSGothic: { label: "도스고딕",   native: 16, file: "DOSGothic.woff2" },
  neodgm:    { label: "둥근모",     native: 16, file: "neodgm.woff2" },
  HBIOS:     { label: "HBIOS",     native: 16, file: "HBIOS-SYS.woff2" },
  Fusion:    { label: "Fusion",    native: 12, file: "fusion-pixel-12px-proportional-ko.ttf.woff2" },
};
const FALLBACK = {
  FusionJA: { native: 12, file: "fusion-pixel-12px-proportional-ja.ttf.woff2" },
  FusionZH: { native: 12, file: "fusion-pixel-12px-proportional-zh_hans.ttf.woff2" },
  FusionLatin: { native: 12, file: "fusion-pixel-12px-proportional-latin.ttf.woff2" },
};
const SAMPLES = {
  ko: [
    "안녕! 나는 민서야. 오늘 여기 온 사람이 고양이에 대해 얘기해보래. 고양이... 고양이는 사실 액체래! 그릇에 담으면 그릇 모양이 된다니까?",
    "잠깐, 방금 '수박'이라고 했어? 수박! 수박은 줄무늬가 몇 개인지 세어본 사람 있어? 나는 세다가 까먹었어.",
    "음... 그건 잘 모르겠는데. 근데 안경 쓴 사람은 비 오는 날 좀 억울하지 않아?",
  ],
  ja: "こんにちは！ぼくはミンソだよ。猫は液体なんだって。",
  zh: "你好！我是敏瑞。听说猫是液体，真的吗？",
  mix: "고양이는 일본어로 猫(ねこ), 중국어로 猫(māo), 프랑스어로 chat(샤)래. Ça va?",
};

const opt = { d: 2, font: "DOSPilgi", ease: "smooth", face: 4, style: "tailDouble", fill: "mint", mode: "rollup", render: "browser", zoom: "fit", auto: true };
const fillOf = () => FILLS[opt.fill];

const loaded = {};
async function loadFonts() {
  const all = { ...FONTS, ...FALLBACK };
  await Promise.all(Object.entries(all).map(async ([name, cfg]) => {
    try {
      const face = new FontFace(name, `url(${FONT_DIR}${cfg.file})`);
      await face.load(); document.fonts.add(face); loaded[name] = true;
    } catch (e) { loaded[name] = false; }
  }));
  glyphCache.clear(); metricsCache.clear(); glyphHas.clear(); renderPanel();
}

// =====================================================================
// 글리프: 네이티브 크기로 그림 → 알파 0/1 이진화 → 정수 d배 확대
// =====================================================================
const glyphCache = new Map();
const scratch = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
const KANA = /[぀-ヿㇰ-ㇿ]/;
const HAN = /[㐀-䶿一-鿿豈-﫿]/;
let textHasKana = false;

function fontFor(ch) {
  if (KANA.test(ch) || HAN.test(ch)) {
    const fb = textHasKana ? "FusionJA" : "FusionZH";
    if (loaded[fb]) return { family: fb, native: FALLBACK[fb].native };
  }
  const name = loaded[opt.font] ? opt.font : "monospace";
  if (name !== "monospace" && !hasGlyph(name, ch) && loaded.FusionLatin) return { family: "FusionLatin", native: FALLBACK.FusionLatin.native };
  return { family: name, native: FONTS[opt.font].native };
}
// 주 서체에 그 글자가 있는지: 뒤에 붙인 기본 서체가 달라도 폭이 같으면 주 서체가 그린 것
const glyphHas = new Map();
function hasGlyph(family, ch) {
  if (ch === " ") return true;
  const k = family + ch;
  if (glyphHas.has(k)) return glyphHas.get(k);
  scratch.font = `40px "${family}", monospace`; const a = scratch.measureText(ch).width;
  scratch.font = `40px "${family}", serif`; const b = scratch.measureText(ch).width;
  glyphHas.set(k, a === b);
  return a === b;
}
const metricsCache = new Map();
function metrics(family, native) {
  const k = family + native;
  if (metricsCache.has(k)) return metricsCache.get(k);
  scratch.font = `${native}px "${family}"`;
  const m = scratch.measureText("가Hg");
  const v = { asc: Math.round(m.fontBoundingBoxAscent ?? native * 0.85), desc: Math.round(m.fontBoundingBoxDescent ?? native * 0.15) };
  metricsCache.set(k, v);
  return v;
}
function baseMetrics() { const f = { family: loaded[opt.font] ? opt.font : "monospace", native: FONTS[opt.font].native }; return metrics(f.family, f.native); }
function hex(s) { const n = parseInt(s.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function glyph(ch, color) {
  const key = `${opt.font}|${textHasKana}|${ch}|${color}`;
  let g = glyphCache.get(key);
  if (g) return g;
  const f = fontFor(ch), base = baseMetrics(), own = metrics(f.family, f.native);
  scratch.font = `${f.native}px "${f.family}"`;
  const w = Math.max(1, Math.round(scratch.measureText(ch).width));
  const h = base.asc + base.desc;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.font = scratch.font; x.fillStyle = "#000";
  // 다른 그리드의 폴백 글자는 세로 가운데를 맞춘다
  const shift = 0;
  x.fillText(ch, 0, base.asc - shift);
  const img = x.getImageData(0, 0, w, h);
  const [r, gg, b] = hex(color);
  for (let i = 0; i < img.data.length; i += 4) {
    img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b;
    img.data[i + 3] = img.data[i + 3] >= 128 ? 255 : 0;
  }
  x.putImageData(img, 0, 0);
  g = { c, w, h, family: f.family, native: f.native, base: base.asc - shift };
  glyphCache.set(key, g);
  return g;
}
// 레이아웃 폭은 "도트" 단위 (서체 네이티브 픽셀). 화면 픽셀 = 도트 × d
const charW = (ch) => glyph(ch, "#000000").w;

// =====================================================================
// 줄바꿈 (어절 단위, 긴 어절은 글자 단위)
// =====================================================================
function wrap(text, from, to, maxW) {
  const lines = [];
  let lineStart = from, lineW = 0, i = from;
  while (i < to) {
    let j = i;
    while (j < to && text[j] !== " ") j++;
    while (j < to && text[j] === " ") j++;
    let wordW = 0, solid = 0;
    for (let k = i; k < j; k++) { wordW += charW(text[k]); if (text[k] !== " ") solid = wordW; }
    if (lineW > 0 && lineW + solid > maxW) { lines.push({ start: lineStart, end: i }); lineStart = i; lineW = 0; }
    if (solid > maxW) {
      for (let k = i; k < j; k++) {
        const cw = charW(text[k]);
        if (lineW > 0 && lineW + cw > maxW && text[k] !== " ") { lines.push({ start: lineStart, end: k }); lineStart = k; lineW = 0; }
        lineW += cw;
      }
    } else lineW += wordW;
    i = j;
  }
  lines.push({ start: lineStart, end: to });
  return lines;
}
function sentenceRanges(text) {
  const out = []; let s = 0; const re = /[.?!~…。！？]+["'”’)]*\s+/g; let m;
  while ((m = re.exec(text))) { out.push([s, m.index + m[0].length]); s = m.index + m[0].length; }
  out.push([s, text.length]);
  return out;
}

// =====================================================================
// 타이밍: 전사 조각을 "그때까지 예약된 오디오의 끝"에 묶는다
// (실제 배포에서는 학생의 playChunk / playHead 를 감싸서 같은 값을 얻는다)
// =====================================================================
class SubtitleClock {
  constructor() { this.reset(); }
  reset() { this.text = ""; this.anchors = []; this.pending = []; this.playHead = 0; this.firstStart = null; this.done = false; }
  onAudio(now, dur) {
    const start = Math.max(this.playHead, now + 0.02);
    if (this.firstStart === null) this.firstStart = start;
    this.playHead = start + dur;
    for (const a of this.pending) a.t = this.playHead;
    this.pending = [];
  }
  onText(str) {
    this.text += str;
    const a = { end: this.text.length, t: this.playHead };
    const prevT = this.anchors.length ? this.anchors[this.anchors.length - 1].t : (this.firstStart ?? 0);
    if (this.firstStart === null || this.playHead <= prevT) this.pending.push(a);
    this.anchors.push(a);
  }
  onTurnComplete() { for (const a of this.pending) a.t = Math.max(this.playHead, a.t); this.pending = []; this.done = true; }
  revealed(now) {
    if (this.firstStart === null) return 0;
    let prevEnd = 0, prevT = this.firstStart, n = 0;
    for (const a of this.anchors) {
      if (this.pending.includes(a)) break;
      const t1 = Math.max(a.t, prevT + 0.001);
      if (now >= t1) n = a.end;
      else { if (now > prevT) n = prevEnd + Math.floor((a.end - prevEnd) * (now - prevT) / (t1 - prevT)); break; }
      prevEnd = a.end; prevT = t1;
    }
    return n;
  }
  speaking(now) { return this.firstStart !== null && now >= this.firstStart && now < this.playHead; }
}

// 모의 Gemini 스트림: 오디오는 실시간보다 3배 빨리 도착, 텍스트는 어절 조각
let timers = [];
function mockStream(text, onEvent) {
  timers.forEach(clearTimeout); timers = [];
  const pieces = text.match(/\S+\s*/g) || [];
  let deliver = 650;
  for (let i = 0; i < pieces.length; i += 1 + (i % 2)) {
    const t = pieces.slice(i, i + 1 + (i % 2)).join("");
    const dur = t.replace(/\s/g, "").length / 6.5 * (0.85 + Math.random() * 0.3) + (/[.?!。！？]\s*$/.test(t) ? 0.35 : 0);
    timers.push(setTimeout(() => onEvent({ type: "audio", dur }), deliver));
    timers.push(setTimeout(() => onEvent({ type: "text", text: t }), deliver + 30));
    deliver += 60 + (dur * 1000) / 3;
  }
  timers.push(setTimeout(() => onEvent({ type: "turnComplete" }), deliver + 50));
}

// =====================================================================
// 움직임
// =====================================================================
const EASE = {
  smooth: (p) => 1 - Math.pow(1 - p, 3),
  bouncy: (p) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  step:   (p) => Math.ceil(p * 4 - 1e-6) / 4,
};
const DUR = { face: 0.36, bubbleOpen: 0.28, bubbleClose: 0.18 };

// =====================================================================
// 그리기
// =====================================================================
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const faceCanvas = document.createElement("canvas");
FACE.mount(faceCanvas);

const now = () => performance.now() / 1000;
const clock = new SubtitleClock();
let phase = "idle", faceP = 0, bubbleP = 0, scrollPx = 0, holdUntil = 0, idleSince = now(), sampleIdx = 0, last = now();

function geometry() {
  const d = opt.d, u = Math.max(1, Math.floor(d));   // 말풍선 도트는 정수 픽셀
  const base = baseMetrics();
  const glyphH = base.asc + base.desc;
  const lineH = (glyphH + 2) * d;
  const faceTop = 4, cell = opt.face, T = 6;
  const top = faceTop + 18 * cell + T * u + 3;
  const x = 6, w = SCREEN.w - 12 - 2 * u;
  const h = SCREEN.h - top - 6 - 2 * u;
  const pad = opt.style === "tail" ? 3 * u : 5 * u;
  const inner = h - 2 * pad;
  const lines = Math.max(1, Math.floor((inner + 2 * d) / lineH));
  const textTop = top + pad + Math.floor((inner - (lines * lineH - 2 * d)) / 2);
  return { d, u, T, lineH, x, y: top, w, h, pad, lines, textTop, textW: Math.floor((w - 2 * pad) / d), faceTop };
}

function stepRect(x, y, w, h, r, u) {
  if (w <= 0 || h <= 0) return;
  for (let i = 0; i <= r; i++) ctx.fillRect(x + (r - i) * u, y + i * u, w - 2 * (r - i) * u, h - 2 * i * u);
}
function shape(b, inflate, dx, dy, color, tail) {
  const { x, y, w, h, u } = b;
  const r = opt.style === "tail" ? 2 : 1;
  ctx.fillStyle = color;
  stepRect(x - inflate + dx, y - inflate + dy, w + 2 * inflate, h + 2 * inflate, inflate < 0 ? r - 1 : r, u);
  if (!tail) return;
  const cx = b.cx + dx;
  for (let j = inflate < 0 ? 0 : 1; j <= b.T; j++) {
    const hw = (b.T - j) * u + u + inflate;
    if (hw > 0) ctx.fillRect(cx - hw, y - j * u + dy, hw * 2, u);
  }
}
function drawBubble(g, e) {
  if (e <= 0.02) return null;
  const u = g.u;
  // 꼬리 끝(얼굴 쪽)을 기준점으로 커지고 줄어든다. 크기는 항상 u 단위로 스냅.
  const snap = (v) => Math.max(2 * u, Math.round(v / u) * u);
  const w = Math.min(SCREEN.w - 4 - 2 * u, snap(g.w * (0.18 + 0.82 * e)));
  const h = Math.min(SCREEN.h - g.y - 2 - 2 * u, snap(g.h * (0.12 + 0.88 * e)));
  const cx = Math.round((g.x + g.w / 2) / u) * u;
  const b = { ...g, w, h, x: cx - Math.round(w / 2 / u) * u, cx };
  const tail = opt.style !== "double";
  const fill = fillOf().fill;
  shape(b, u, 0, 0, CHAR.halo, tail);              // 바깥 흰 헤일로
  shape(b, 0, 2 * u, 2 * u, CHAR.ink, tail);       // 하드 그림자
  shape(b, 0, 0, 0, CHAR.ink, tail);               // 바깥 테두리
  shape(b, -u, 0, 0, fill, tail);                  // 채움 (꼬리 안쪽까지)
  if (opt.style !== "tail") {                      // 안쪽 두 번째 테두리 (꼬리는 바깥 테두리에만 붙음)
    shape(b, -2 * u, 0, 0, CHAR.ink, false);
    shape(b, -3 * u, 0, 0, fill, false);
  }
  return b;
}

function drawChar(ch, x, y, g) {
  if (opt.render === "binary") {
    const sh = glyph(ch, fillOf().shadow), gl = glyph(ch, CHAR.ink);
    ctx.drawImage(sh.c, x + g.d, y + g.d, sh.w * g.d, sh.h * g.d);
    ctx.drawImage(gl.c, x, y, gl.w * g.d, gl.h * g.d);
    return gl.w * g.d;
  }
  // 기본: 서체 글리프를 브라우저가 그대로 그린다 (모양을 손대지 않음)
  const gl = glyph(ch, CHAR.ink);
  const sd = Math.max(1, Math.round(g.d));
  ctx.font = `${gl.native * g.d}px "${gl.family}"`;
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = fillOf().shadow; ctx.fillText(ch, x + sd, y + gl.base * g.d + sd);
  ctx.fillStyle = CHAR.ink; ctx.fillText(ch, x, y + gl.base * g.d);
  return gl.w * g.d;
}

function drawText(g, b, t) {
  const text = clock.text;
  const shown = clock.revealed(t);
  let from = 0, to = text.length;
  if (opt.mode === "sentence") [from, to] = sentenceRanges(text).find(([s, e]) => shown < e || e === text.length);
  const lines = wrap(text, from, to, g.textW);
  let cur = 0;
  lines.forEach((l, i) => { if (shown > l.start) cur = i; });
  const target = Math.max(0, cur - g.lines + 1) * g.lineH;
  if (scrollPx > target) scrollPx = target;
  if (scrollPx < target) {
    const speed = opt.ease === "step" ? Math.ceil(g.lineH / 2) : Math.max(1, Math.round(g.lineH * 0.18));
    scrollPx = Math.min(target, scrollPx + speed);
  }
  const left = b.x + g.pad;
  ctx.save();
  const inset = (opt.style === "tail" ? 1 : 3) * g.u;   // 안쪽 테두리 안에서만 글자가 보이게
  ctx.beginPath(); ctx.rect(b.x + inset, b.y + inset, b.w - 2 * inset, b.h - 2 * inset); ctx.clip();
  lines.forEach((l, i) => {
    let x = left;
    const y = g.textTop + i * g.lineH - scrollPx;
    if (y + g.lineH < b.y || y > b.y + b.h) return;
    for (let k = l.start; k < Math.min(l.end, shown); k++) x = Math.round(x + drawChar(text[k], Math.round(x), y, g));
  });
  ctx.restore();
  if (clock.done && shown >= text.length && Math.floor(t * 2.5) % 2 === 0) {
    const u = g.u, bx = b.x + b.w - g.pad - 4 * u, by = b.y + b.h - g.pad - u;
    ctx.fillStyle = CHAR.ink;
    for (let j = 0; j < 3; j++) ctx.fillRect(bx + j * u, by + j * u, (5 - 2 * j) * u, u);
  }
  return { shown, total: text.length };
}

let stat = null;
function frame() {
  const t = now(), dt = Math.min(0.05, t - last); last = t;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (phase === "open" && clock.done && t > clock.playHead) {
    if (!holdUntil) holdUntil = t + 1.4;
    if (t > holdUntil) phase = "closing";
  }
  // 열림: 얼굴 먼저 → 말풍선. 닫힘: 말풍선 먼저 → 얼굴.
  const talking = phase === "open";
  const kf = reduce ? 1 : dt / DUR.face;
  if (talking) {
    faceP = Math.min(1, faceP + kf);
    if (faceP > 0.55) bubbleP = Math.min(1, bubbleP + (reduce ? 1 : dt / DUR.bubbleOpen));
  } else {
    if (bubbleP > 0) bubbleP = Math.max(0, bubbleP - (reduce ? 1 : dt / DUR.bubbleClose));
    else faceP = Math.max(0, faceP - kf);
    if (phase === "closing" && bubbleP === 0 && faceP === 0) { phase = "idle"; idleSince = t; }
  }
  if (opt.auto && phase === "idle" && t - idleSince > 1.6) nextSample();

  const speaking = clock.speaking(t);
  FACE.setState(phase === "thinking" ? "processing" : speaking ? "speaking" : "idle");
  FACE.setLevel(speaking ? 0.02 + Math.random() * 0.09 : 0);

  const ease = EASE[opt.ease];
  const g = geometry();
  ctx.fillStyle = CHAR.bg; ctx.fillRect(0, 0, SCREEN.w, SCREEN.h);
  const fe = Math.min(1, Math.max(0, opt.ease === "bouncy" ? EASE.smooth(faceP) : ease(faceP)));
  const cell = 10 - (10 - opt.face) * fe;
  const fw = Math.round(32 * cell), fh = Math.round(18 * cell);
  const fy = Math.round(((SCREEN.h - 180) / 2) * (1 - fe) + g.faceTop * fe);
  ctx.drawImage(faceCanvas, Math.round((SCREEN.w - fw) / 2), fy, fw, fh);

  const b = drawBubble(g, ease(bubbleP));
  stat = { g, shown: 0, total: clock.text.length };
  if (b && bubbleP >= 1) stat = { g, ...drawText(g, b, t) };
  requestAnimationFrame(frame);
}

// =====================================================================
// 말하기 / 끼어들기 / 자동 반복
// =====================================================================
function say(text) {
  timers.forEach(clearTimeout); timers = [];
  textHasKana = KANA.test(text);
  clock.reset(); scrollPx = 0; holdUntil = 0;
  phase = "thinking";
  mockStream(text, (e) => {
    const t = now();
    if (e.type === "audio") { clock.onAudio(t, e.dur); if (phase === "thinking") phase = "open"; }
    if (e.type === "text") clock.onText(e.text);
    if (e.type === "turnComplete") clock.onTurnComplete();
  });
}
function interrupt() { timers.forEach(clearTimeout); timers = []; clock.reset(); phase = "closing"; holdUntil = 0; }
function nextSample() {
  const s = SAMPLES.ko[sampleIdx++ % SAMPLES.ko.length];
  document.getElementById("text").value = s;
  say(s);
}

// =====================================================================
// 패널
// =====================================================================
const CHOICES = {
  d: () => [1, 2, 2.5, 3].map((v) => [v, `${v}× · ${FONTS[opt.font].native * v}px`]),
  font: () => Object.entries(FONTS).map(([k, f]) => [k, `${f.label} ${f.native}`]),
  ease: () => [["smooth", "스르륵"], ["bouncy", "통통"], ["step", "계단"]],
  face: () => [[5, "1/2"], [4, "2/5"], [3, "3/10"]],
  style: () => [["tailDouble", "꼬리 + 이중"], ["tail", "꼬리"], ["double", "이중 테두리"]],
  fill: () => Object.entries(FILLS).map(([k, f]) => [k, f.label]),
  mode: () => [["rollup", "롤업"], ["sentence", "문장마다 비우기"]],
  render: () => [["browser", "서체 원본"], ["binary", "이진화 (비교용)"]],
  zoom: () => [["fit", "화면에 맞춤"], [1, "1×"], [2, "2×"], [3, "3×"]],
};
function renderPanel() {
  for (const [k, list] of Object.entries(CHOICES)) {
    const el = document.querySelector(`[data-g="${k}"]`);
    el.replaceChildren(...list().map(([v, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      if (k === "font" && loaded[v] === false) { b.disabled = true; b.title = "서체 파일을 못 읽었어요"; }
      if (opt[k] === v) b.className = "on";
      b.onclick = () => { opt[k] = v; glyphCache.clear(); metricsCache.clear(); glyphHas.clear(); scrollPx = 0; applyZoom(); renderPanel(); };
      return b;
    }));
  }
  document.getElementById("auto").className = opt.auto ? "on" : "";
}
function applyZoom() {
  let z = opt.zoom;
  if (z === "fit") {
    const avail = cv.parentElement.parentElement.clientWidth - 28;
    z = Math.max(1, Math.min(4, Math.floor(avail / SCREEN.w)));
  }
  cv.style.width = SCREEN.w * z + "px";
  cv.style.height = SCREEN.h * z + "px";
}
function renderInfo() {
  if (!stat) return;
  const g = stat.g, adv = charW("가");
  document.getElementById("info").textContent =
    `한 줄에 한글 약 ${Math.floor(g.textW / adv)}자 · ${g.lines}줄 · 글자 높이 ${(baseMetrics().asc + baseMetrics().desc) * g.d}px\n` +
    `표시 ${stat.shown} / 받은 글자 ${stat.total}` + (Object.values(loaded).includes(false) ? "\n일부 서체 파일을 못 읽었어요" : "");
}
document.getElementById("say").onclick = () => { opt.auto = false; renderPanel(); say(document.getElementById("text").value); };
document.getElementById("cut").onclick = () => { opt.auto = false; renderPanel(); interrupt(); };
document.getElementById("auto").onclick = () => { opt.auto = !opt.auto; idleSince = now(); renderPanel(); };
document.querySelectorAll("[data-sample]").forEach((b) => (b.onclick = () => {
  opt.auto = false; renderPanel();
  document.getElementById("text").value = SAMPLES[b.dataset.sample]; say(SAMPLES[b.dataset.sample]);
}));
addEventListener("resize", applyZoom);
setInterval(renderInfo, 250);
applyZoom(); renderPanel();
loadFonts().then(() => { idleSince = now() - 1; });
requestAnimationFrame(frame);
window.__sub = { say, interrupt, opt, clock, renderPanel };
</script>
