<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 자막 미리보기</title>
<style>
  :root { --bg: #1b1b1f; --panel: #26262c; --ink: #e9e9ee; --dim: #9a9aa6; --line: #3a3a44; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; align-items: flex-start; }
  #stage { image-rendering: pixelated; image-rendering: crisp-edges; display: block; box-shadow: 0 0 0 1px var(--line); }
  .panel { background: var(--panel); border-radius: 10px; padding: 16px; width: 340px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row > b { width: 64px; color: var(--dim); font-weight: 500; }
  button { background: #33333c; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button.on { background: #e9e9ee; color: #111; }
  textarea { width: 100%; box-sizing: border-box; height: 72px; background: #1e1e23; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  #info { color: var(--dim); font-size: 12px; white-space: pre-line; }
  h1 { font-size: 14px; margin: 0; }
</style>
</head>
<body>
<main>
  <canvas id="stage" width="320" height="240"></canvas>
  <div class="panel">
    <h1>민서 · 320×240 자막 미리보기</h1>
    <div class="row"><b>확대</b><span data-g="zoom"></span></div>
    <div class="row"><b>글자 d</b><span data-g="d"></span></div>
    <div class="row"><b>서체</b><span data-g="font"></span></div>
    <div class="row"><b>말풍선</b><span data-g="style"></span></div>
    <div class="row"><b>줄넘김</b><span data-g="mode"></span></div>
    <div class="row"><b>도착 순서</b><span data-g="order"></span></div>
    <textarea id="text">안녕! 나는 민서야. 오늘 여기 온 사람이 고양이에 대해 얘기해보래. 고양이... 고양이는 사실 액체래! 그릇에 담으면 그릇 모양이 된다니까? 진짜야, 진짜.</textarea>
    <div class="row">
      <button id="say">말하기</button>
      <button id="cut">끼어들기</button>
      <button data-sample="ja">日本語</button>
      <button data-sample="zh">中文</button>
      <button data-sample="mix">섞어서</button>
    </div>
    <div id="info"></div>
  </div>
</main>
<script src="minseo-face.js"></script>
<script>
"use strict";
// =====================================================================
// 화면 / 캐릭터 설정
// =====================================================================
const SCREEN = { w: 320, h: 240 };
const CHAR = {
  bg: "#F9503C", ink: "#121212", fill: "#FFFFFF", halo: "#FFFFFF",
  textShadow: "#F2A3C4",
};
// 서체: native = 서체가 설계된 픽셀 그리드. 파일 이름은 fonts/ 에 올라온 것에 맞춰 고친다.
const FONT_DIR = "../../fonts/";
const FONTS = {
  DOSPilgi:  { native: 16, files: ["DOSPilgi.woff2", "DOSPilgi.ttf", "DOSPilgi.otf", "DOSPilgiMedium.ttf"] },
  DOSGothic: { native: 16, files: ["DOSGothic.woff2", "DOSGothic.ttf", "DOSGothic.otf"] },
  neodgm:    { native: 16, files: ["neodgm.woff2", "neodgm.ttf"] },
  HBIOS:     { native: 16, files: ["HBIOS-SYS.woff2", "HBIOS-SYS.ttf"] },
};
// 한자·가나 폴백 (12px 그리드). 한글 16px과 섞어도 각자 네이티브 크기로 그린 뒤 같은 d배로 키운다.
const FALLBACK = { name: "Fusion", native: 12, files: [
  "fusion-pixel-12px-proportional-ja.woff2", "fusion-pixel-12px-proportional-zh_hans.woff2",
  "fusion-pixel-12px-proportional-ko.woff2",
] };
const SAMPLES = {
  ja: "こんにちは！ぼくはミンソだよ。猫は液体なんだって。",
  zh: "你好！我是敏瑞。听说猫是液体，真的吗？",
  mix: "고양이는 일본어로 猫(ねこ)라고 한대. 중국어로는 猫(māo)!",
};

const opt = { zoom: 3, d: 1, font: "DOSPilgi", style: "bubble", mode: "rollup", order: "audio-first" };

// =====================================================================
// 서체 로딩
// =====================================================================
const loaded = {};
async function loadFamily(name, files) {
  for (const f of files) {
    try {
      const face = new FontFace(name, `url(${FONT_DIR}${encodeURIComponent(f)})`);
      await face.load();
      document.fonts.add(face);
      return f;
    } catch (e) { /* 다음 후보 */ }
  }
  return null;
}
async function loadFonts() {
  for (const [name, cfg] of Object.entries(FONTS)) loaded[name] = await loadFamily(name, cfg.files);
  loaded.Fusion = await loadFamily("Fusion", FALLBACK.files);
  glyphCache.clear();
  renderInfo();
}

// =====================================================================
// 글리프: 서체 네이티브 크기로 그린 뒤 알파를 0/1로 자른다(이진화).
// → 안티앨리어싱이 남지 않은 진짜 도트. 그 다음 정수 d배로 확대한다.
// 리눅스 Chromium은 CSS로 글자 AA를 끌 수 없어서 이 방식이 Pi에서도 가장 확실하다.
// =====================================================================
const glyphCache = new Map();
const scratch = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
const isCJKFallback = (ch) => /[぀-ヿ㐀-䶿一-鿿豈-﫿ㇰ-ㇿ]/.test(ch);

function fontFor(ch) {
  if (isCJKFallback(ch) && loaded.Fusion) return { family: "Fusion", native: FALLBACK.native };
  const cfg = FONTS[opt.font];
  return { family: loaded[opt.font] ? opt.font : "monospace", native: cfg.native };
}
function metrics(family, native) {
  scratch.font = `${native}px "${family}"`;
  const m = scratch.measureText("가Hg");
  return { asc: Math.round(m.fontBoundingBoxAscent ?? native * 0.8), desc: Math.round(m.fontBoundingBoxDescent ?? native * 0.2) };
}
function lineMetrics() {
  const f = fontFor("가");
  return metrics(f.family, f.native);
}
function glyph(ch, color) {
  const key = opt.font + "|" + ch + "|" + color;
  let g = glyphCache.get(key);
  if (g) return g;
  const f = fontFor(ch);
  const base = lineMetrics();
  const own = metrics(f.family, f.native);
  scratch.font = `${f.native}px "${f.family}"`;
  const w = Math.max(1, Math.round(scratch.measureText(ch).width));
  const h = base.asc + base.desc;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.font = scratch.font;
  x.textBaseline = "alphabetic";
  x.fillStyle = "#000";
  // 폴백 서체는 기준선을 한글 서체에 맞춘다
  x.fillText(ch, 0, base.asc + (f.native !== FONTS[opt.font].native ? Math.round((own.desc - base.desc) / 2) : 0));
  const img = x.getImageData(0, 0, w, h);
  const [r, gg, b] = hex(color);
  for (let i = 0; i < img.data.length; i += 4) {
    const on = img.data[i + 3] >= 128;
    img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = on ? 255 : 0;
  }
  x.putImageData(img, 0, 0);
  g = { c, w, h };
  glyphCache.set(key, g);
  return g;
}
function hex(s) { const n = parseInt(s.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function charW(ch) { return glyph(ch, "#000000").w; }

// =====================================================================
// 줄바꿈: 어절 단위(keep-all). 한 어절이 줄보다 길면 글자 단위로 자른다.
// 결과는 [{start, end}] (원문 인덱스 범위)
// =====================================================================
function wrap(text, from, to, maxW) {
  const lines = [];
  let lineStart = from, lineW = 0, i = from;
  while (i < to) {
    // 다음 어절(공백 포함) 범위
    let j = i;
    while (j < to && text[j] !== " ") j++;
    while (j < to && text[j] === " ") j++;
    let wordW = 0, wordWNoSpace = 0;
    for (let k = i; k < j; k++) { wordW += charW(text[k]); if (text[k] !== " ") wordWNoSpace = wordW; }
    if (lineW > 0 && lineW + wordWNoSpace > maxW) { lines.push({ start: lineStart, end: i }); lineStart = i; lineW = 0; }
    if (wordWNoSpace > maxW) { // 긴 어절은 글자 단위로
      for (let k = i; k < j; k++) {
        const cw = charW(text[k]);
        if (lineW > 0 && lineW + cw > maxW && text[k] !== " ") { lines.push({ start: lineStart, end: k }); lineStart = k; lineW = 0; }
        lineW += cw;
      }
    } else lineW += wordW;
    i = j;
  }
  lines.push({ start: lineStart, end: to });
  return lines;
}
function sentenceRanges(text) {
  const out = []; let s = 0;
  const re = /[.?!~…。！？]+["'”’)]*\s+/g; let m;
  while ((m = re.exec(text))) { out.push([s, m.index + m[0].length]); s = m.index + m[0].length; }
  out.push([s, text.length]);
  return out;
}

// =====================================================================
// 타이밍: 전사 조각을 "그 시점까지 예약된 오디오의 끝 시각"에 묶는다.
// 실제 배포에서는 학생의 playChunk / playHead 를 감싸서 같은 값을 얻는다.
// =====================================================================
class SubtitleClock {
  constructor(now) { this.reset(now); }
  reset(now) {
    this.text = ""; this.anchors = []; this.playHead = 0; this.firstStart = null;
    this.lastAudioAnchor = 0; this.pending = []; this.done = false; this.t0 = now;
  }
  // 오디오 조각이 예약될 때
  onAudio(now, dur) {
    const start = Math.max(this.playHead, now + 0.02);
    if (this.firstStart === null) this.firstStart = start;
    this.playHead = start + dur;
    // 오디오보다 먼저 온 텍스트는 이 오디오 끝에 묶는다
    for (const a of this.pending) a.t = this.playHead;
    this.pending = [];
  }
  // 전사 텍스트가 도착할 때
  onText(now, str) {
    this.text += str;
    const a = { end: this.text.length, t: this.playHead };
    const prevT = this.anchors.length ? this.anchors[this.anchors.length - 1].t : (this.firstStart ?? 0);
    if (this.playHead <= prevT || this.firstStart === null) this.pending.push(a); // 아직 이 텍스트의 소리가 안 옴
    this.anchors.push(a);
  }
  onTurnComplete() { for (const a of this.pending) a.t = Math.max(this.playHead, a.t); this.pending = []; this.done = true; }
  // 지금 몇 글자까지 보여줄지
  revealed(now) {
    if (this.firstStart === null) return 0;
    let prevEnd = 0, prevT = this.firstStart, n = 0;
    for (const a of this.anchors) {
      if (this.pending.includes(a)) break;
      const t1 = Math.max(a.t, prevT + 0.001);
      if (now >= t1) { n = a.end; }
      else { if (now > prevT) n = prevEnd + Math.floor((a.end - prevEnd) * (now - prevT) / (t1 - prevT)); break; }
      prevEnd = a.end; prevT = t1;
    }
    return n;
  }
  speaking(now) { return this.firstStart !== null && now >= this.firstStart && now < this.playHead; }
}

// =====================================================================
// 모의 Gemini 스트림: 오디오는 실시간보다 3배 빨리, 텍스트는 어절 조각으로
// =====================================================================
let timers = [];
function mockStream(text, onEvent) {
  timers.forEach(clearTimeout); timers = [];
  const pieces = text.match(/\S+\s*/g) || [];
  let deliver = 600, chunks = [];
  for (let i = 0; i < pieces.length; i += 1 + (i % 2)) {
    const t = pieces.slice(i, i + 1 + (i % 2)).join("");
    const dur = t.replace(/\s/g, "").length / 6.5 * (0.85 + Math.random() * 0.3) + (/[.?!]\s*$/.test(t) ? 0.35 : 0);
    chunks.push({ t, dur });
  }
  for (const c of chunks) {
    const audio = () => onEvent({ type: "audio", dur: c.dur });
    const txt = () => onEvent({ type: "text", text: c.t });
    const order = opt.order === "audio-first" ? [audio, txt] : [txt, audio];
    for (const fn of order) { timers.push(setTimeout(fn, deliver)); deliver += 30; }
    deliver += (c.dur * 1000) / 3;
  }
  timers.push(setTimeout(() => onEvent({ type: "turnComplete" }), deliver + 50));
}

// =====================================================================
// 레이아웃 + 그리기
// =====================================================================
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const faceCanvas = document.createElement("canvas");
FACE.mount(faceCanvas);

const now = () => performance.now() / 1000;
const clock = new SubtitleClock(now());
let phase = "idle";        // idle | thinking | open | closing
let anim = 0;              // 0 = 대기 레이아웃, 1 = 말하기 레이아웃 (계단식)
let bubbleOpen = 0;        // 0..1 (계단식)
let scrollPx = 0, holdUntil = 0;

function geometry() {
  const d = opt.d, u = d;
  const lm = lineMetrics();
  const glyphH = lm.asc + lm.desc;
  const lineH = (glyphH + 3) * d;
  const faceTop = 6, faceCell = 5;
  const bubbleTop = faceTop + 18 * faceCell + 6 * u + 4;
  const x = 8, w = SCREEN.w - 16 - 2 * u;
  const pad = 4 * u + (opt.style === "box" ? 3 * u : 2 * u);
  const maxH = SCREEN.h - bubbleTop - 4 - 2 * u;
  const lines = Math.max(1, Math.min(4, Math.floor((maxH - 2 * pad) / lineH)));
  const h = lines * lineH + 2 * pad - 3 * d;
  return { d, u, lineH, glyphH, x, y: bubbleTop, w, h, pad, lines, textW: Math.floor((w - 2 * pad) / d) };
}

function stepRect(x, y, w, h, r, u, color) {
  ctx.fillStyle = color;
  for (let i = 0; i <= r; i++) ctx.fillRect(x + (r - i) * u, y + i * u, w - 2 * (r - i) * u, h - 2 * i * u);
}
function shape(g, inflate, dx, dy, color, withTail) {
  const { x, y, w, h, u } = g;
  const r = opt.style === "box" ? 1 : 2;
  stepRect(x - inflate + dx, y - inflate + dy, w + 2 * inflate, h + 2 * inflate, inflate < 0 ? Math.max(0, r - 1) : r, u, color);
  if (!withTail) return;
  const T = 5, cx = x + Math.floor(w / 2) + dx;
  ctx.fillStyle = color;
  for (let j = inflate < 0 ? 0 : 1; j <= T; j++) {
    const hw = (T - j) * u + u + inflate;
    if (hw <= 0) continue;
    ctx.fillRect(cx - hw, y - j * u + dy, hw * 2, u);
  }
}
function drawBubble(g, open) {
  if (open <= 0) return;
  // 열림 애니메이션: 높이를 계단식으로 (가운데 기준)
  const full = g.h;
  const h = Math.max(4 * g.u, Math.round((full * open) / g.u) * g.u);
  const gg = { ...g, y: g.y + Math.round((full - h) / 2 / g.u) * g.u, h };
  const u = g.u;
  const tail = opt.style === "bubble" && open >= 1;
  if (opt.style === "bubble") {
    shape(gg, u, 0, 0, CHAR.halo, tail);            // 바깥 흰 헤일로
    shape(gg, 0, 2 * u, 2 * u, CHAR.ink, tail);     // 하드 그림자
    shape(gg, 0, 0, 0, CHAR.ink, tail);             // 테두리
    shape(gg, -u, 0, 0, CHAR.fill, tail);           // 채움
  } else {
    shape(gg, 0, 2 * u, 2 * u, CHAR.ink, false);
    shape(gg, 0, 0, 0, CHAR.ink, false);
    shape(gg, -u, 0, 0, CHAR.fill, false);
    shape(gg, -2 * u, 0, 0, CHAR.ink, false);        // 안쪽 두 번째 테두리
    shape(gg, -3 * u, 0, 0, CHAR.fill, false);
  }
  return gg;
}

function drawText(g, t) {
  const text = clock.text;
  const shown = clock.revealed(t);
  let from = 0, to = text.length;
  if (opt.mode === "sentence") {
    const sr = sentenceRanges(text).find(([s, e]) => shown < e || e === text.length) || [0, text.length];
    [from, to] = sr;
  }
  const lines = wrap(text, from, to, g.textW);
  let cur = 0;
  lines.forEach((l, i) => { if (shown > l.start) cur = i; });
  const targetScroll = Math.max(0, cur - g.lines + 1) * g.lineH;
  // 롤업: 한 줄 높이를 3계단으로 올라간다
  if (scrollPx < targetScroll) scrollPx = Math.min(targetScroll, scrollPx + Math.ceil(g.lineH / 3 / g.d) * g.d);
  if (scrollPx > targetScroll) scrollPx = targetScroll;
  const left = g.x + g.pad, top = g.y + g.pad;
  ctx.save();
  ctx.beginPath(); ctx.rect(left, top, g.w - 2 * g.pad, g.h - 2 * g.pad + g.d); ctx.clip();
  lines.forEach((l, i) => {
    let x = left;
    const y = top + i * g.lineH - scrollPx;
    if (y + g.lineH < top || y > g.y + g.h) return;
    for (let k = l.start; k < Math.min(l.end, shown); k++) {
      const ch = text[k];
      const sh = glyph(ch, CHAR.textShadow), gl = glyph(ch, CHAR.ink);
      ctx.drawImage(sh.c, x + g.d, y + g.d, sh.w * g.d, sh.h * g.d);
      ctx.drawImage(gl.c, x, y, gl.w * g.d, gl.h * g.d);
      x += gl.w * g.d;
    }
  });
  ctx.restore();
  // 다 말하고 기다리는 동안 ▼ 깜빡임
  if (clock.done && shown >= text.length && Math.floor(t * 2.5) % 2 === 0) {
    const u = g.d, bx = g.x + g.w - g.pad - 5 * u, by = g.y + g.h - g.pad - 2 * u;
    ctx.fillStyle = CHAR.ink;
    for (let j = 0; j < 3; j++) ctx.fillRect(bx + j * u, by + j * u, (5 - 2 * j) * u, u);
  }
  return { shown, lines: lines.length };
}

function frame() {
  const t = now();
  // 상태 진행
  if (phase === "open" && clock.done && t > clock.playHead) {
    if (!holdUntil) holdUntil = t + 1.2;
    if (t > holdUntil) phase = "closing";
  }
  const wantTalk = phase === "open";
  // 계단식: 프레임당 일정량, 35ms 마다
  if (!frame.last || t - frame.last > 0.035) {
    frame.last = t;
    if (wantTalk) {
      if (anim < 1) anim = Math.min(1, anim + 0.2);
      else if (bubbleOpen < 1) bubbleOpen = Math.min(1, bubbleOpen + 0.34);
    } else {
      if (bubbleOpen > 0) bubbleOpen = Math.max(0, bubbleOpen - 0.5);
      else if (anim > 0) anim = Math.max(0, anim - 0.2);
      else if (phase === "closing") { phase = "idle"; }
    }
  }
  // 얼굴 상태
  const speaking = clock.speaking(t);
  FACE.setState(phase === "thinking" ? "processing" : speaking ? "speaking" : phase === "open" ? "idle" : "idle");
  FACE.setLevel(speaking ? 0.02 + Math.random() * 0.09 : 0);

  // 그리기
  ctx.fillStyle = CHAR.bg; ctx.fillRect(0, 0, SCREEN.w, SCREEN.h);
  const cell = Math.round(10 - 5 * anim);
  const fw = 32 * cell, fh = 18 * cell;
  const fx = Math.round((SCREEN.w - fw) / 2);
  const fy = Math.round(((SCREEN.h - 18 * 10) / 2) * (1 - anim) + 6 * anim);
  ctx.drawImage(faceCanvas, fx, fy, fw, fh);
  const g = geometry();
  const gg = drawBubble(g, bubbleOpen);
  let stat = { shown: 0, lines: 0 };
  if (bubbleOpen >= 1 && gg) stat = drawText(g, t);
  frame.stat = { ...stat, g };
  requestAnimationFrame(frame);
}

// =====================================================================
// 말하기 / 끼어들기
// =====================================================================
function say(text) {
  clock.reset(now());
  scrollPx = 0; holdUntil = 0;
  phase = "thinking";
  mockStream(text, (e) => {
    const t = now();
    if (e.type === "audio") { clock.onAudio(t, e.dur); if (phase === "thinking") phase = "open"; }
    if (e.type === "text") clock.onText(t, e.text);
    if (e.type === "turnComplete") clock.onTurnComplete();
  });
}
function interrupt() { timers.forEach(clearTimeout); timers = []; clock.reset(now()); phase = "closing"; }

// =====================================================================
// 패널
// =====================================================================
const CHOICES = {
  zoom: [[1, "1×"], [2, "2×"], [3, "3×"]],
  d: [[1, "1 (16px)"], [2, "2 (32px)"]],
  font: Object.keys(FONTS).map((k) => [k, k]),
  style: [["bubble", "꼬리 말풍선"], ["box", "이중 테두리"]],
  mode: [["rollup", "롤업"], ["sentence", "문장마다 비우기"]],
  order: [["audio-first", "오디오 먼저"], ["text-first", "텍스트 먼저"]],
};
function renderPanel() {
  for (const [k, list] of Object.entries(CHOICES)) {
    const el = document.querySelector(`[data-g="${k}"]`);
    el.innerHTML = "";
    for (const [v, label] of list) {
      const b = document.createElement("button");
      b.textContent = label + (k === "font" && !loaded[v] ? " (없음)" : "");
      if (opt[k] === v) b.className = "on";
      b.onclick = () => { opt[k] = v; glyphCache.clear(); scrollPx = 0; applyZoom(); renderPanel(); };
      el.appendChild(b);
    }
  }
}
function applyZoom() { cv.style.width = SCREEN.w * opt.zoom + "px"; cv.style.height = SCREEN.h * opt.zoom + "px"; }
function renderInfo() {
  const s = frame.stat;
  const fontsLine = Object.keys(FONTS).map((k) => `${k}: ${loaded[k] || "없음"}`).join("\n") + `\nFusion(폴백): ${loaded.Fusion || "없음"}`;
  document.getElementById("info").textContent =
    (s ? `한 줄 ${s.g.textW}px(네이티브) · ${s.g.lines}줄 · 줄높이 ${s.g.lineH}px\n표시 ${s.shown}/${clock.text.length}자\n\n` : "") + fontsLine;
}
document.getElementById("say").onclick = () => say(document.getElementById("text").value);
document.getElementById("cut").onclick = interrupt;
document.querySelectorAll("[data-sample]").forEach((b) => (b.onclick = () => {
  document.getElementById("text").value = SAMPLES[b.dataset.sample]; say(SAMPLES[b.dataset.sample]);
}));
setInterval(renderInfo, 250);
applyZoom(); renderPanel();
loadFonts().then(renderPanel);
requestAnimationFrame(frame);
window.__sub = { say, interrupt, opt, clock, renderPanel };
</script>
</body>
</html>
