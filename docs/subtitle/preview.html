<script>

const CHARS = [

    "잠깐, 방금 '수박'이라고 했어? 수박! 수박은 줄무늬가 몇 개인지 세어본 사람 있어? 나는 세다가 까먹었어.",

// 확정: 꼬리 + 이중 테두리, 말할 때 얼굴 1/2, 보기 배율은 화면에 맞춤
const opt = { d: 2.5, font: "DOSPilgi", ease: "step", face: 5, style: "tailDouble", fill: "mint", mode: "rollup", place: "below", zoom: "fit", auto: true };

const fillOf = () => CHAR.fills[opt.fill];
const PER_CHAR = ["font", "d", "fill", "place"];   // 캐릭터마다 따로 저장되는 값
// 그릴 캐릭터로 전환: 캐릭터 값을 opt 에 싣고, 그 캐릭터의 캔버스·롤업 상태를 쓴다
function use(c) {
  CHAR = c;

const loaded = {};

  const all = { ...FONTS, ...FALLBACK };
  await Promise.all(Object.entries(all).map(async ([name, cfg]) => {
    try {
      const face = new FontFace(name, `url(${FONT_DIR}${cfg.file})`);
      await face.load(); document.fonts.add(face); loaded[name] = true;
    } catch (e) { loaded[name] = false; }
  }));
  glyphCache.clear(); metricsCache.clear(); glyphHas.clear(); renderPanel();
}

// =====================================================================
// 글리프: 네이티브 크기로 그림 → 알파 0/1 이진화 → 정수 d배 확대
// =====================================================================
const glyphCache = new Map();
const scratch = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
const KANA = /[぀-ヿㇰ-ㇿ]/;

let textHasKana = false;

function fontFor(ch) {
  if (KANA.test(ch) || HAN.test(ch)) {
    const fb = textHasKana ? "FusionJA" : "FusionZH";
    if (loaded[fb]) return { family: fb, native: FALLBACK[fb].native };

  if (name !== "monospace" && !hasGlyph(name, ch) && loaded.FusionLatin) return { family: "FusionLatin", native: FALLBACK.FusionLatin.native };

// 주 서체에 그 글자가 있는지: 뒤에 붙인 기본 서체가 달라도 폭이 같으면 주 서체가 그린 것

    c.ui.places.replaceChildren(...[["below", "얼굴 아래"], ["above", "얼굴 위"]].map(([v, label]) => {
      const b = document.createElement("button"); b.textContent = label; if (c.place === v) b.className = "on";
      b.onclick = () => setValue("place", v, c);
      return b;
    }));
  }
}
function exportText() {
  return CHARS.map((c) => `${c.name}(${c.id}): 색 ${c.fills[c.fill].label} ${c.fills[c.fill].fill} · ${c.place === "below" ? "얼굴 아래" : "얼굴 위"} · ${FONTS[c.font].label} ${c.d}×`).join("\n");
}
document.getElementById("copy").onclick = async () => {
  const pre = document.getElementById("export");
  pre.textContent = exportText(); pre.hidden = false;
  try { await navigator.clipboard.writeText(pre.textContent); document.getElementById("copy").textContent = "복사됨"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.getElementById("copy").textContent = "선택됨 · Cmd+C"; }
  setTimeout(() => (document.getElementById("copy").textContent = "설정 복사"), 1800);
};
function renderInfo() {
  if (!stat) return;
  use(selected); const g = stat.g, adv = charW("가");
  document.getElementById("info").textContent =
    `한 줄에 한글 약 ${Math.floor(g.textW / adv)}자 · ${g.lines}줄 · 글자 높이 ${(baseMetrics().asc + baseMetrics().desc) * g.d}px\n` +
    `표시 ${stat.shown} / 받은 글자 ${stat.total}` + (Object.values(loaded).includes(false) ? "\n일부 서체 파일을 못 읽었어요" : "");
}
document.getElementById("say").onclick = () => { opt.auto = false; renderPanel(); say(document.getElementById("text").value); };
document.getElementById("cut").onclick = () => { opt.auto = false; renderPanel(); interrupt(); };
document.getElementById("auto").onclick = () => { opt.auto = !opt.auto; idleSince = now(); renderPanel(); };
document.querySelectorAll("[data-sample]").forEach((b) => (b.onclick = () => {
  opt.auto = false; renderPanel();
  document.getElementById("text").value = SAMPLES[b.dataset.sample]; say(SAMPLES[b.dataset.sample]);
}));
addEventListener("resize", () => { applyZoom(); renderGrid(); });
setInterval(renderInfo, 250);
applyZoom(); renderPanel(); renderGrid();
loadFonts().then(() => { idleSince = now() - 1; });
requestAnimationFrame(frame);
window.__sub = { say, interrupt, opt, clock, renderPanel, CHARS, setValue };
</script>
